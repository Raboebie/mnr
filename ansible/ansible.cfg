[defaults]
inventory = inventory.yml
vault_password_file = .vault_password
host_key_checking = False
# community.general.yaml was removed in community.general 12; ansible-core >= 2.13
# provides the same output via result_format on the built-in default callback.
result_format = yaml
interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
enable_plugins = yaml, ini

[winrm]
# pywinrm is required on the control node: pip install pywinrm
