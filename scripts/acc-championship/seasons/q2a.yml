  practice:   {minutes: 240, day_of_weekend: 1}
  qualifying: {minutes: 15,  day_of_weekend: 2}
  race:       {minutes: 30,  day_of_weekend: 3}

weather_defaults:
  ambient_temp: 24
  track_temp: 30
  cloud_level: 0.05
  rain: 0
  weather_randomness: 4

# hour_of_day applies to ALL sessions in the round. Time-of-day mapping:
# Night=21, Late afternoon=17, Midday=12, Early morning=7.
rounds:
