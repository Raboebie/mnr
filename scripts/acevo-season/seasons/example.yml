# Worked example. Track slugs come from tracks.json (the server's own event list
# of the 35 valid AC EVO tracks). Weather/grip use the game's enums, not numbers.
server:
  name: "MNR | Monday Night Racing"
  game_port: 34597
  http_port: 8080
  max_players: 19
  # cars omitted -> keep the captured serverconfig's real car list.

# Non-race session lengths (minutes). Race length is per round (race_minutes).
# warmup: 0 disables it.
session_defaults:
  practice: {minutes: 10}
  qualify:  {minutes: 10}
  warmup:   {minutes: 0}

# Weather is enum-based (validated schema), not temps/percentages.
# type: clear | scattered clouds | broken clouds | overcast | drizzle | rain | heavy rain | damp
# behaviour: static | dynamic     grip: green | fast | optimum
weather_defaults:
  type: clear
  behaviour: static
  grip: green

# hour_of_day applies to all sessions. Each round's track is a tracks.json slug.
rounds:
  - {track: kyalami_gp, hour_of_day: 12, race_minutes: 30, date: "2026-07-27"}
  - {track: spa_gp,     hour_of_day: 17, race_minutes: 30, date: "2026-08-03"}
  - {track: imola_gp,   hour_of_day: 9,  race_minutes: 60, date: "2026-08-10",
     weather: {type: overcast}}
